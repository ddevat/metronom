<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="metronome">
    <h1>
      <svg id="logo" viewBox="0 0 40 60" width="32" height="48">
        <polygon points="10,58 30,58 24,10 16,10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="20" y1="10" x2="32" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="38" r="3" fill="currentColor"/>
      </svg>
      Metronom
    </h1>

    <div class="panel" id="beats-panel">
      <div id="beats"></div>
    </div>

    <div class="panel" id="time-signature-panel">
      <label for="time-signature">Rytmus</label>
      <select id="time-signature">
        <option value="2/2">2/2</option>
        <option value="2/4">2/4</option>
        <option value="3/4">3/4</option>
        <option value="4/4" selected>4/4</option>
        <option value="5/4">5/4</option>
        <option value="6/4">6/4</option>
        <option value="7/4">7/4</option>
        <option value="3/8">3/8</option>
        <option value="5/8">5/8</option>
        <option value="6/8">6/8</option>
        <option value="7/8">7/8</option>
        <option value="9/8">9/8</option>
        <option value="12/8">12/8</option>
      </select>
    </div>

    <div class="panel" id="tempo-panel">
      <label>Tempo</label>
      <div id="wheel-wrapper">
        <div id="wheel-highlight"></div>
        <div id="wheel" tabindex="0"></div>
      </div>
      <span id="tempo-unit">bpm</span>
    </div>

    <div class="panel" id="play-panel">
      <button id="play-btn" type="button">&#9654;</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
